spring.application.name=ms-inventra-api

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# A V2 (remove_user_role_column) foi aplicada no banco da Aiven mas nunca commitada; a V1 atual ja nasce sem a coluna.
spring.flyway.ignore-migration-patterns=*:missing

spring.mvc.problemdetails.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.connect-timeout=10s
spring.data.redis.timeout=10s
management.endpoint.health.show-details=always

# INV2-25: um consumer ativo por namespace; demais instâncias aguardam a concessão.
app.redis.product-queue.consumer-enabled=${REDIS_PRODUCT_QUEUE_CONSUMER_ENABLED:true}
app.redis.product-queue.key-prefix=${REDIS_PRODUCT_QUEUE_KEY_PREFIX:inventra:product-registration}
