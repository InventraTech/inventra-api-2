name: Queue integration tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test against disposable Redis
        env:
          REDIS_INTEGRATION_TESTS: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: '16379'
          REDIS_DATABASE: '0'
          REDIS_SSL: 'false'
        run: bash mvnw -B -ntp test
