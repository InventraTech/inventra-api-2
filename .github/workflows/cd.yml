name: "CD"

on:
  push:
    tags: ['v*']

# O workflow compartilhado publica no GHCR (packages: write); um workflow
# reutilizável não pode exceder as permissões concedidas pelo chamador.
permissions:
  contents: read
  packages: write

jobs:
  cd:
    uses: InventraTech/.github/.github/workflows/cd-java.yaml@main
    with:
      image-name: inventra-api
      gitops-app: inventra-api
    secrets: inherit
